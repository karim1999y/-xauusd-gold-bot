def main():

    print("================================")
    print("XAU Gold Signals Bot")
    print("Live market engine started")
    print("Symbol:", SYMBOL)
    print("Timeframe:", INTERVAL)
    print("================================")

    offset = None
    last_market_check = 0

    while True:

        try:

            # ============================================
            # Telegram
            # ============================================

            result = telegram(
                "getUpdates",
                {
                    "timeout": 5,
                    "offset": offset,
                }
            )

            for update in result.get("result", []):

                offset = update["update_id"] + 1

                message = update.get("message")

                if message:
                    handle_message(message)

            # ============================================
            # Market check
            # ============================================

            now = time.time()

            if now - last_market_check >= CHECK_SECONDS:

                last_market_check = now

                try:
                    check_market()

                except Exception as e:
                    print("Market error:", e)

            time.sleep(1)

        except Exception as e:

            print("Main error:", e)

            time.sleep(5)


if __name__ == "__main__":
    main()
